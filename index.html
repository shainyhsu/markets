<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Live Rate & Charts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #f7931a;
            --bg-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-color);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            text-align: left;
            flex: 1;
        }
        .lang-btn {
            background: none;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .lang-btn:hover {
            background: #f5f5f5;
            border-color: #ccc;
        }
        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 8px;
        }
        .currency-label {
            width: 70px;
            font-size: 18px;
            font-weight: 600;
            color: #555;
        }
        input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 20px;
            text-align: right;
            font-weight: 500;
            color: var(--text-color);
            width: 100%;
            background: transparent;
        }
        input::placeholder { color: #ccc; }
        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-left: 6px;
            animation: pulse 1.5s infinite;
            vertical-align: middle;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .chart-title {
            font-size: 14px;
            color: #666;
            margin-top: 24px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .chart-container {
            position: relative;
            height: 160px;
            width: 100%;
            margin-bottom: 4px;
        }
        .loading {
            text-align: center;
            color: #999;
            font-size: 14px;
            padding: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 id="title">即時匯率換算 <span class="live-dot" title="Live"></span></h2>
        <button class="lang-btn" id="lang-btn" title="Switch language">🌐</button>
    </div>

    <div class="input-group">
        <span class="currency-label">BTC</span>
        <input type="number" id="btc-input" placeholder="1" step="any" min="0" value="1" aria-label="BTC amount">
    </div>
    <div class="input-group">
        <span class="currency-label">USD</span>
        <input type="text" id="usd-input" readonly placeholder="Connecting..." aria-label="USD amount">
    </div>

    <div class="chart-title" id="label-1h">比特幣最近 1 小時價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-1h" class="loading">載入中...</div>
        <canvas id="chart-1h" style="display:none;" aria-label="BTC 1H chart"></canvas>
    </div>

    <div class="chart-title" id="label-24h">比特幣最近 24 小時價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-24h" class="loading">載入中...</div>
        <canvas id="chart-24h" style="display:none;" aria-label="BTC 24H chart"></canvas>
    </div>

    <div class="chart-title" id="label-3d">比特幣最近 3 天價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-3d" class="loading">載入中...</div>
        <canvas id="chart-3d" style="display:none;" aria-label="BTC 3D chart"></canvas>
    </div>

    <div class="chart-title" id="label-7d">比特幣最近 7 天價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-7d" class="loading">載入中...</div>
        <canvas id="chart-7d" style="display:none;" aria-label="BTC 7D chart"></canvas>
    </div>
</div>
<script>
    // ========== i18n ==========
    const i18n = {
        zh: {
            title: '即時匯率換算',
            label1h: '比特幣最近 1 小時價格曲線 (USD)',
            label24h: '比特幣最近 24 小時價格曲線 (USD)',
            label3d: '比特幣最近 3 天價格曲線 (USD)',
            label7d: '比特幣最近 7 天價格曲線 (USD)',
            loading: '載入中...',
            loadFail: '載入失敗，請稍後重試',
            connecting: '連線中...'
        },
        en: {
            title: 'Live Exchange Rate',
            label1h: 'BTC Last 1 Hour Price Chart (USD)',
            label24h: 'BTC Last 24 Hours Price Chart (USD)',
            label3d: 'BTC Last 3 Days Price Chart (USD)',
            label7d: 'BTC Last 7 Days Price Chart (USD)',
            loading: 'Loading...',
            loadFail: 'Failed to load, please try again later',
            connecting: 'Connecting...'
        }
    };

    let currentLang = localStorage.getItem('btc_lang') || 'zh';

    function applyLang(lang) {
        currentLang = lang;
        localStorage.setItem('btc_lang', lang);
        document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';

        const t = i18n[lang];
        document.getElementById('title').innerHTML = t.title + ' <span class="live-dot" title="Live"></span>';
        document.getElementById('label-1h').textContent = t.label1h;
        document.getElementById('label-24h').textContent = t.label24h;
        document.getElementById('label-3d').textContent = t.label3d;
        document.getElementById('label-7d').textContent = t.label7d;

        // Update loading texts if still visible
        ['1h', '24h', '3d', '7d'].forEach(id => {
            const el = document.getElementById(`loading-${id}`);
            if (el && el.style.display !== 'none') {
                el.textContent = t.loading;
            }
        });

        const usdInput = document.getElementById('usd-input');
        if (usdInput.value === '' || usdInput.placeholder.includes('連') || usdInput.placeholder.includes('Connect')) {
            usdInput.placeholder = t.connecting;
        }
    }

    document.getElementById('lang-btn').addEventListener('click', () => {
        applyLang(currentLang === 'zh' ? 'en' : 'zh');
    });

    // ========== Price & Charts ==========
    let btcToUsd = 0;
    const chartInstances = {};
    let prices1h = [];
    let lastAppendTs = 0;

    const btcInput = document.getElementById('btc-input');
    const usdInput = document.getElementById('usd-input');

    function connectWebSocket() {
        const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                const price = parseFloat(data.p);
                if (price > 0) {
                    btcToUsd = price;
                    updateRates(parseFloat(btcInput.value) || 1);

                    const now = Date.now();
                    if (now - lastAppendTs > 2500) {
                        lastAppendTs = now;
                        appendTo1hChart(now, price);
                    }
                }
            } catch (e) {}
        };

        ws.onclose = () => setTimeout(connectWebSocket, 3000);
        ws.onerror = () => ws.close();
    }

    function updateRates(btcValue) {
        if (!Number.isFinite(btcValue) || btcValue <= 0) {
            usdInput.value = '';
            return;
        }
        usdInput.value = (btcValue * btcToUsd).toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    btcInput.addEventListener('input', (e) => updateRates(parseFloat(e.target.value)));

    async function fetchKlines(interval, limit) {
        const url = `https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=${limit}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Binance API error');
        const data = await res.json();
        return data.map(k => [k[0], parseFloat(k[4])]);
    }

    async function loadCharts() {
        const t = i18n[currentLang];
        try {
            const klines1h = await fetchKlines('1m', 60);
            prices1h = klines1h;
            renderChart('1h', prices1h, 1);

            const klines24h = await fetchKlines('5m', 288);
            renderChart('24h', klines24h, 1);

            const klines3d = await fetchKlines('15m', 288);
            renderChart('3d', klines3d, 3);

            const klines7d = await fetchKlines('1h', 168);
            renderChart('7d', klines7d, 7);
        } catch (err) {
            console.error(err);
            document.querySelectorAll('.loading').forEach(el => {
                if (el.style.display !== 'none') el.textContent = t.loadFail;
            });
        }
    }

    function appendTo1hChart(ts, price) {
        if (!prices1h.length) return;
        const oneHourAgo = Date.now() - 60 * 60 * 1000;
        prices1h = prices1h.filter(([t]) => t >= oneHourAgo);
        prices1h.push([ts, price]);
        if (prices1h.length > 120) prices1h = prices1h.slice(-120);
        renderChart('1h', prices1h, 1);
    }

    function formatLabel(timestamp, days) {
        const date = new Date(timestamp);
        if (days <= 1) {
            return date.getHours().toString().padStart(2, '0') + ':' +
                   date.getMinutes().toString().padStart(2, '0');
        }
        return (date.getMonth() + 1) + '/' + date.getDate() + ' ' +
               date.getHours().toString().padStart(2, '0') + ':00';
    }

    function renderChart(id, prices, days) {
        const loadingEl = document.getElementById(`loading-${id}`);
        const canvas = document.getElementById(`chart-${id}`);

        if (!prices || prices.length < 2) {
            loadingEl.textContent = i18n[currentLang].loadFail;
            return;
        }

        loadingEl.style.display = 'none';
        canvas.style.display = 'block';

        const labels = prices.map(([ts]) => formatLabel(ts, days));
        const values = prices.map(([, price]) => price);
        const ctx = canvas.getContext('2d');

        if (chartInstances[id]) {
            chartInstances[id].data.labels = labels;
            chartInstances[id].data.datasets[0].data = values;
            chartInstances[id].update('none');
            return;
        }

        chartInstances[id] = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: 'BTC/USD',
                    data: values,
                    borderColor: '#f7931a',
                    borderWidth: 2,
                    pointRadius: 0,
                    hoverRadius: 4,
                    fill: false,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { maxTicksLimit: 6, color: '#999', maxRotation: 0 }
                    },
                    y: {
                        grid: { color: '#f0f0f0' },
                        ticks: {
                            color: '#999',
                            callback: v => Number(v).toLocaleString('en-US')
                        }
                    }
                }
            }
        });
    }

    // Init
    applyLang(currentLang);
    loadCharts();
    connectWebSocket();
</script>
</body>
</html>
