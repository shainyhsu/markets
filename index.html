<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Rate & Charts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-color: #1c1c1e;
            --text-color: #e8e8e8;
            --secondary-text: #999;
            --border-color: #2a2a2a;
            --input-border: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-color);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 8px;
        }
        h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            text-align: left;
            flex: 1;
            white-space: nowrap;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .symbol-btn, .lang-btn {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s, border-color 0.2s;
            padding: 0 10px;
            color: #ccc;
        }
        .symbol-btn:hover, .lang-btn:hover {
            background: #333;
            border-color: #555;
        }
        .symbol-btn.active {
            background: #f7931a;
            border-color: #f7931a;
            color: #fff;
        }
        .lang-btn {
            width: 36px;
            padding: 0;
            font-size: 18px;
        }
        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--input-border);
            padding-bottom: 8px;
        }
        .currency-label {
            width: 70px;
            font-size: 18px;
            font-weight: 600;
            color: #aaa;
        }
        input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 20px;
            text-align: right;
            font-weight: 500;
            color: var(--text-color);
            width: 100%;
            background: transparent;
        }
        input::placeholder { color: #666; }
        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-left: 6px;
            animation: pulse 1.5s infinite;
            vertical-align: middle;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .chart-title {
            font-size: 14px;
            color: var(--secondary-text);
            margin-top: 24px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .chart-container {
            position: relative;
            height: 160px;
            width: 100%;
            margin-bottom: 4px;
        }
        .loading {
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 id="title">即時匯率換算 <span class="live-dot" title="Live"></span></h2>
        <div class="header-actions">
            <button class="symbol-btn active" id="btn-btc" data-symbol="BTCUSDT">BTC</button>
            <button class="symbol-btn" id="btn-xau" data-symbol="XAUUSDT">XAU</button>
            <button class="lang-btn" id="lang-btn" title="Switch language">🌐</button>
        </div>
    </div>

    <div class="input-group">
        <span class="currency-label" id="base-label">BTC</span>
        <input type="number" id="base-input" placeholder="1" step="any" min="0" value="1" aria-label="Amount">
    </div>
    <div class="input-group">
        <span class="currency-label">USD</span>
        <input type="text" id="usd-input" readonly placeholder="Connecting..." aria-label="USD amount">
    </div>

    <div class="chart-title" id="label-1h">最近 1 小時價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-1h" class="loading">載入中...</div>
        <canvas id="chart-1h" style="display:none;"></canvas>
    </div>

    <div class="chart-title" id="label-24h">最近 24 小時價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-24h" class="loading">載入中...</div>
        <canvas id="chart-24h" style="display:none;"></canvas>
    </div>

    <div class="chart-title" id="label-3d">最近 3 天價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-3d" class="loading">載入中...</div>
        <canvas id="chart-3d" style="display:none;"></canvas>
    </div>

    <div class="chart-title" id="label-7d">最近 7 天價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-7d" class="loading">載入中...</div>
        <canvas id="chart-7d" style="display:none;"></canvas>
    </div>
</div>
<script>
    // ========== Config ==========
    const SYMBOLS = {
        BTCUSDT: {
            name: { zh: '比特幣', en: 'Bitcoin' },
            short: 'BTC',
            color: '#f7931a',
            wsBase: 'wss://stream.binance.com:9443/ws/',
            restBase: 'https://api.binance.com/api/v3/'
        },
        XAUUSDT: {
            name: { zh: '黃金', en: 'Gold' },
            short: 'XAU',
            color: '#f0c14b',          // brighter gold for dark background
            wsBase: 'wss://fstream.binance.com/ws/',
            restBase: 'https://fapi.binance.com/fapi/v1/'
        }
    };

    let currentSymbol = localStorage.getItem('live_symbol') || 'BTCUSDT';
    let currentLang = localStorage.getItem('btc_lang') || 'zh';
    let currentPrice = 0;
    let prices1h = [];
    let lastAppendTs = 0;
    let ws = null;
    const chartInstances = {};

    const baseInput = document.getElementById('base-input');
    const usdInput = document.getElementById('usd-input');
    const baseLabel = document.getElementById('base-label');

    // ========== i18n ==========
    const i18n = {
        zh: {
            title: '即時匯率換算',
            label1h: (s) => `${s} 最近 1 小時價格曲線 (USD)`,
            label24h: (s) => `${s} 最近 24 小時價格曲線 (USD)`,
            label3d: (s) => `${s} 最近 3 天價格曲線 (USD)`,
            label7d: (s) => `${s} 最近 7 天價格曲線 (USD)`,
            loading: '載入中...',
            loadFail: '載入失敗，請稍後重試',
            connecting: '連線中...'
        },
        en: {
            title: 'Live Exchange Rate',
            label1h: (s) => `${s} Last 1 Hour Price Chart (USD)`,
            label24h: (s) => `${s} Last 24 Hours Price Chart (USD)`,
            label3d: (s) => `${s} Last 3 Days Price Chart (USD)`,
            label7d: (s) => `${s} Last 7 Days Price Chart (USD)`,
            loading: 'Loading...',
            loadFail: 'Failed to load, please try again later',
            connecting: 'Connecting...'
        }
    };

    function applyLang(lang) {
        currentLang = lang;
        localStorage.setItem('btc_lang', lang);
        document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
        updateTexts();
    }

    function updateTexts() {
        const t = i18n[currentLang];
        const conf = SYMBOLS[currentSymbol];
        const name = conf.name[currentLang];

        document.getElementById('title').innerHTML = t.title + ' <span class="live-dot" title="Live"></span>';
        document.getElementById('label-1h').textContent = t.label1h(name);
        document.getElementById('label-24h').textContent = t.label24h(name);
        document.getElementById('label-3d').textContent = t.label3d(name);
        document.getElementById('label-7d').textContent = t.label7d(name);
        baseLabel.textContent = conf.short;

        ['1h', '24h', '3d', '7d'].forEach(id => {
            const el = document.getElementById(`loading-${id}`);
            if (el && el.style.display !== 'none') el.textContent = t.loading;
        });
        if (!usdInput.value) usdInput.placeholder = t.connecting;
    }

    document.getElementById('lang-btn').addEventListener('click', () => {
        applyLang(currentLang === 'zh' ? 'en' : 'zh');
    });

    // ========== Symbol Switch ==========
    function switchSymbol(symbol) {
        if (symbol === currentSymbol) return;
        currentSymbol = symbol;
        localStorage.setItem('live_symbol', symbol);

        document.getElementById('btn-btc').classList.toggle('active', symbol === 'BTCUSDT');
        document.getElementById('btn-xau').classList.toggle('active', symbol === 'XAUUSDT');

        currentPrice = 0;
        prices1h = [];
        lastAppendTs = 0;
        usdInput.value = '';
        usdInput.placeholder = i18n[currentLang].connecting;

        Object.keys(chartInstances).forEach(id => {
            chartInstances[id].destroy();
            delete chartInstances[id];
            document.getElementById(`chart-${id}`).style.display = 'none';
            document.getElementById(`loading-${id}`).style.display = 'block';
            document.getElementById(`loading-${id}`).textContent = i18n[currentLang].loading;
        });

        updateTexts();
        connectWebSocket();
        loadCharts();
    }

    document.getElementById('btn-btc').addEventListener('click', () => switchSymbol('BTCUSDT'));
    document.getElementById('btn-xau').addEventListener('click', () => switchSymbol('XAUUSDT'));

    // ========== WebSocket ==========
    function connectWebSocket() {
        if (ws) {
            ws.onclose = null;
            ws.close();
        }

        const conf = SYMBOLS[currentSymbol];
        const stream = currentSymbol.toLowerCase() + '@trade';
        ws = new WebSocket(conf.wsBase + stream);

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                const price = parseFloat(data.p);
                if (price > 0) {
                    currentPrice = price;
                    updateRates(parseFloat(baseInput.value) || 1);

                    const now = Date.now();
                    if (now - lastAppendTs > 2500) {
                        lastAppendTs = now;
                        appendTo1hChart(now, price);
                    }
                }
            } catch (e) {}
        };

        ws.onclose = () => setTimeout(connectWebSocket, 3000);
        ws.onerror = () => ws.close();
    }

    function updateRates(amount) {
        if (!Number.isFinite(amount) || amount <= 0 || !currentPrice) {
            usdInput.value = '';
            return;
        }
        usdInput.value = (amount * currentPrice).toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    baseInput.addEventListener('input', (e) => updateRates(parseFloat(e.target.value)));

    // ========== Charts ==========
    async function fetchKlines(interval, limit) {
        const conf = SYMBOLS[currentSymbol];
        const url = `${conf.restBase}klines?symbol=${currentSymbol}&interval=${interval}&limit=${limit}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        return data.map(k => [k[0], parseFloat(k[4])]);
    }

    async function loadCharts() {
        const t = i18n[currentLang];
        try {
            const k1h = await fetchKlines('1m', 60);
            prices1h = k1h;
            renderChart('1h', prices1h, 1);

            const k24h = await fetchKlines('5m', 288);
            renderChart('24h', k24h, 1);

            const k3d = await fetchKlines('15m', 288);
            renderChart('3d', k3d, 3);

            const k7d = await fetchKlines('1h', 168);
            renderChart('7d', k7d, 7);
        } catch (err) {
            console.error(err);
            document.querySelectorAll('.loading').forEach(el => {
                if (el.style.display !== 'none') el.textContent = t.loadFail;
            });
        }
    }

    function appendTo1hChart(ts, price) {
        if (!prices1h.length) return;
        const oneHourAgo = Date.now() - 60 * 60 * 1000;
        prices1h = prices1h.filter(([t]) => t >= oneHourAgo);
        prices1h.push([ts, price]);
        if (prices1h.length > 120) prices1h = prices1h.slice(-120);
        renderChart('1h', prices1h, 1);
    }

    function formatLabel(timestamp, days) {
        const date = new Date(timestamp);
        if (days <= 1) {
            return date.getHours().toString().padStart(2, '0') + ':' +
                   date.getMinutes().toString().padStart(2, '0');
        }
        return (date.getMonth() + 1) + '/' + date.getDate() + ' ' +
               date.getHours().toString().padStart(2, '0') + ':00';
    }

    function renderChart(id, prices, days) {
        const loadingEl = document.getElementById(`loading-${id}`);
        const canvas = document.getElementById(`chart-${id}`);
        const color = SYMBOLS[currentSymbol].color;

        if (!prices || prices.length < 2) {
            loadingEl.textContent = i18n[currentLang].loadFail;
            return;
        }

        loadingEl.style.display = 'none';
        canvas.style.display = 'block';

        const labels = prices.map(([ts]) => formatLabel(ts, days));
        const values = prices.map(([, price]) => price);
        const ctx = canvas.getContext('2d');

        if (chartInstances[id]) {
            chartInstances[id].data.labels = labels;
            chartInstances[id].data.datasets[0].data = values;
            chartInstances[id].data.datasets[0].borderColor = color;
            chartInstances[id].update('none');
            return;
        }

        chartInstances[id] = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: currentSymbol,
                    data: values,
                    borderColor: color,
                    borderWidth: 2,
                    pointRadius: 0,
                    hoverRadius: 4,
                    fill: false,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { maxTicksLimit: 6, color: '#666', maxRotation: 0 }
                    },
                    y: {
                        grid: { color: '#2a2a2a' },
                        ticks: {
                            color: '#666',
                            callback: v => Number(v).toLocaleString('en-US')
                        }
                    }
                }
            }
        });
    }

    // ========== Init ==========
    document.getElementById('btn-btc').classList.toggle('active', currentSymbol === 'BTCUSDT');
    document.getElementById('btn-xau').classList.toggle('active', currentSymbol === 'XAUUSDT');

    applyLang(currentLang);
    connectWebSocket();
    loadCharts();
</script>
</body>
</html>
