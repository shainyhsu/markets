<script>
    const SYMBOLS = {
        BTCUSDT: {
            name: { zh: '比特幣', en: 'Bitcoin' },
            short: 'BTC',
            color: '#f7931a',
            wsBase: 'wss://stream.binance.com:9443/ws/',
            restBase: 'https://api.binance.com/api/v3/'
        },
        XAUUSDT: {
            name: { zh: '黃金', en: 'Gold' },
            short: 'XAU',
            color: '#f0c14b',
            wsBase: 'wss://fstream.binance.com/ws/',
            restBase: 'https://fapi.binance.com/fapi/v1/'
        }
    };

    const TIMEZONES = {
        TPE: 'Asia/Taipei',
        NYC: 'America/New_York'
    };

    let currentSymbol = localStorage.getItem('live_symbol') || 'BTCUSDT';
    let currentLang = localStorage.getItem('btc_lang') || 'zh';
    let currentTz = localStorage.getItem('live_tz') || 'TPE';
    let currentPrice = 0;
    let prices1h = [];
    let lastAppendTs = 0;
    let ws = null;
    // 每張圖：K 線週期、筆數、涵蓋天數
    const CHARTS = [
        { id: '1h',  interval: '1m',  limit: 60,  days: 1 },
        { id: '24h', interval: '5m',  limit: 288, days: 1 },
        { id: '3d',  interval: '15m', limit: 288, days: 3 },
        { id: '7d',  interval: '1h',  limit: 168, days: 7 },
        { id: '30d', interval: '4h',  limit: 180, days: 30 },
        { id: '3m',  interval: '12h', limit: 182, days: 91 },
        { id: '6m',  interval: '1d',  limit: 183, days: 183 },
        { id: '1y',  interval: '1d',  limit: 365, days: 365 }
    ];
    const CHART_DAYS = Object.fromEntries(CHARTS.map(c => [c.id, c.days]));
    const chartInstances = {};
    const chartData = {};
    // 記錄每個圖表目前選中的時間戳（而不是 index）
    const selectedTs = {};

    const baseInput = document.getElementById('base-input');
    const usdInput = document.getElementById('usd-input');
    const baseLabel = document.getElementById('base-label');
    const tzBtn = document.getElementById('tz-btn');

    const i18n = {
        zh: {
            title: '即時匯率換算',
            label1h: s => `${s} 最近 1 小時價格曲線 (USD)`,
            label24h: s => `${s} 最近 24 小時價格曲線 (USD)`,
            label3d: s => `${s} 最近 3 天價格曲線 (USD)`,
            label7d: s => `${s} 最近 7 天價格曲線 (USD)`,
            label30d: s => `${s} 最近 30 天價格曲線 (USD)`,
            label3m: s => `${s} 最近 3 個月價格曲線 (USD)`,
            label6m: s => `${s} 最近 6 個月價格曲線 (USD)`,
            label1y: s => `${s} 最近 1 年價格曲線 (USD)`,
            loading: '載入中...',
            loadFail: '載入失敗',
            connecting: '連線中...'
        },
        en: {
            title: 'Live Exchange Rate',
            label1h: s => `${s} Last 1 Hour Price Chart (USD)`,
            label24h: s => `${s} Last 24 Hours Price Chart (USD)`,
            label3d: s => `${s} Last 3 Days Price Chart (USD)`,
            label7d: s => `${s} Last 7 Days Price Chart (USD)`,
            label30d: s => `${s} Last 30 Days Price Chart (USD)`,
            label3m: s => `${s} Last 3 Months Price Chart (USD)`,
            label6m: s => `${s} Last 6 Months Price Chart (USD)`,
            label1y: s => `${s} Last 1 Year Price Chart (USD)`,
            loading: 'Loading...',
            loadFail: 'Failed to load',
            connecting: 'Connecting...'
        }
    };

    function applyLang(lang) {
        currentLang = lang;
        localStorage.setItem('btc_lang', lang);
        document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
        updateTexts();
    }

    function applyTz(tz) {
        currentTz = tz;
        localStorage.setItem('live_tz', tz);
        tzBtn.textContent = tz;
        Object.keys(chartData).forEach(id => {
            if (chartData[id] && chartInstances[id]) {
                renderChart(id, chartData[id], CHART_DAYS[id] || 1);
            }
        });
    }

    function updateTexts() {
        const t = i18n[currentLang];
        const conf = SYMBOLS[currentSymbol];
        const name = conf.name[currentLang];
        document.getElementById('title').innerHTML = t.title + ' <span class="live-dot"></span>';
        CHARTS.forEach(c => {
            document.getElementById(`label-${c.id}`).textContent = t[`label${c.id}`](name);
        });
        baseLabel.textContent = conf.short;
        CHARTS.map(c => c.id).forEach(id => {
            const el = document.getElementById(`loading-${id}`);
            if (el && el.style.display !== 'none') el.textContent = t.loading;
        });
        if (!usdInput.value) usdInput.placeholder = t.connecting;
    }

    document.getElementById('lang-btn').addEventListener('click', () => applyLang(currentLang === 'zh' ? 'en' : 'zh'));
    tzBtn.addEventListener('click', () => applyTz(currentTz === 'TPE' ? 'NYC' : 'TPE'));

    function switchSymbol(symbol) {
        if (symbol === currentSymbol) return;
        currentSymbol = symbol;
        localStorage.setItem('live_symbol', symbol);
        document.getElementById('btn-btc').classList.toggle('active', symbol === 'BTCUSDT');
        document.getElementById('btn-xau').classList.toggle('active', symbol === 'XAUUSDT');

        currentPrice = 0;
        prices1h = [];
        lastAppendTs = 0;
        usdInput.value = '';
        usdInput.placeholder = i18n[currentLang].connecting;

        Object.keys(chartInstances).forEach(id => {
            chartInstances[id].destroy();
            delete chartInstances[id];
            delete selectedTs[id];
            document.getElementById(`chart-${id}`).style.display = 'none';
            document.getElementById(`loading-${id}`).style.display = 'block';
            document.getElementById(`loading-${id}`).textContent = i18n[currentLang].loading;
            document.getElementById(`tip-${id}`).style.display = 'none';
        });

        updateTexts();
        connectWebSocket();
        loadCharts();
    }

    document.getElementById('btn-btc').addEventListener('click', () => switchSymbol('BTCUSDT'));
    document.getElementById('btn-xau').addEventListener('click', () => switchSymbol('XAUUSDT'));

    function connectWebSocket() {
        if (ws) { ws.onclose = null; ws.close(); }
        const conf = SYMBOLS[currentSymbol];
        ws = new WebSocket(conf.wsBase + currentSymbol.toLowerCase() + '@trade');
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                const price = parseFloat(data.p);
                if (price > 0) {
                    currentPrice = price;
                    updateRates(parseFloat(baseInput.value) || 1);
                    const now = Date.now();
                    if (now - lastAppendTs > 2500) {
                        lastAppendTs = now;
                        appendTo1hChart(now, price);
                    }
                }
            } catch(e) {}
        };
        ws.onclose = () => setTimeout(connectWebSocket, 3000);
        ws.onerror = () => ws.close();
    }

    function updateRates(amount) {
        if (!Number.isFinite(amount) || amount <= 0 || !currentPrice) {
            usdInput.value = '';
            return;
        }
        usdInput.value = (amount * currentPrice).toLocaleString('en-US', {
            minimumFractionDigits: 2, maximumFractionDigits: 2
        });
    }
    baseInput.addEventListener('input', e => updateRates(parseFloat(e.target.value)));

    async function fetchKlines(interval, limit) {
        const conf = SYMBOLS[currentSymbol];
        const url = `${conf.restBase}klines?symbol=${currentSymbol}&interval=${interval}&limit=${limit}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        return data.map(k => [k[0], parseFloat(k[4])]);
    }

    async function loadCharts() {
        const t = i18n[currentLang];
        const sym = currentSymbol;
        for (const c of CHARTS) {
            try {
                const k = await fetchKlines(c.interval, c.limit);
                if (sym !== currentSymbol) return; // 切換幣種後放棄舊資料
                if (c.id === '1h') prices1h = k;
                renderChart(c.id, c.id === '1h' ? prices1h : k, c.days);
            } catch (err) {
                console.error(err);
                const el = document.getElementById(`loading-${c.id}`);
                if (el && el.style.display !== 'none') el.textContent = t.loadFail;
            }
        }
    }

    function appendTo1hChart(ts, price) {
        if (!prices1h.length) return;
        const oneHourAgo = Date.now() - 60 * 60 * 1000;
        prices1h = prices1h.filter(([t]) => t >= oneHourAgo);
        prices1h.push([ts, price]);
        if (prices1h.length > 120) prices1h = prices1h.slice(-120);
        renderChart('1h', prices1h, 1);
    }

    function getDateInTz(timestamp) {
        return new Date(new Date(timestamp).toLocaleString('en-US', { timeZone: TIMEZONES[currentTz] }));
    }

    function formatLabel(timestamp, days) {
        const date = getDateInTz(timestamp);
        if (days <= 1) {
            return date.getHours().toString().padStart(2,'0') + ':' +
                   date.getMinutes().toString().padStart(2,'0');
        }
        if (days >= 365) {
            return String(date.getFullYear()).slice(2) + '/' + (date.getMonth()+1) + '/' + date.getDate();
        }
        if (days >= 30) {
            return (date.getMonth()+1) + '/' + date.getDate();
        }
        return (date.getMonth()+1) + '/' + date.getDate() + ' ' +
               date.getHours().toString().padStart(2,'0') + ':00';
    }

    function formatFullTime(ts) {
        const d = getDateInTz(ts);
        return d.getFullYear() + '/' +
               (d.getMonth()+1).toString().padStart(2,'0') + '/' +
               d.getDate().toString().padStart(2,'0') + ' ' +
               d.getHours().toString().padStart(2,'0') + ':' +
               d.getMinutes().toString().padStart(2,'0') +
               ' (' + currentTz + ')';
    }

    const crosshairPlugin = {
        id: 'crosshair',
        afterDraw(chart) {
            const state = chart.$crosshair;
            if (!state || state.index == null) return;
            const { ctx, chartArea } = chart;
            const meta = chart.getDatasetMeta(0);
            if (!meta.data[state.index]) return;
            const pt = meta.data[state.index];
            const x = pt.x;
            const y = pt.y;
            ctx.save();
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, chartArea.top);
            ctx.lineTo(x, chartArea.bottom);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(chartArea.left, y);
            ctx.lineTo(chartArea.right, y);
            ctx.stroke();
            ctx.restore();
        }
    };

    // 根據選中的 timestamp 重新定位十字準線與標籤
    function repositionCrosshair(id) {
        const chart = chartInstances[id];
        const tip = document.getElementById(`tip-${id}`);
        const prices = chartData[id];
        const ts = selectedTs[id];

        if (!chart || !prices || ts == null) {
            if (tip) tip.style.display = 'none';
            if (chart) chart.$crosshair = null;
            return;
        }

        // 找最接近的 timestamp
        let nearest = -1;
        let minDiff = Infinity;
        prices.forEach((p, i) => {
            const diff = Math.abs(p[0] - ts);
            if (diff < minDiff) {
                minDiff = diff;
                nearest = i;
            }
        });

        // 如果時間差太大（超過 3 分鐘），代表該點已移出畫面，清除
        if (nearest < 0 || minDiff > 3 * 60 * 1000) {
            selectedTs[id] = null;
            chart.$crosshair = null;
            tip.style.display = 'none';
            chart.draw();
            return;
        }

        chart.$crosshair = { index: nearest };
        chart.draw();

        const [selTs, price] = prices[nearest];
        tip.innerHTML = `<div class="price">${price.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
                         <div class="time">${formatFullTime(selTs)}</div>`;
        tip.style.display = 'block';

        const meta = chart.getDatasetMeta(0);
        const pt = meta.data[nearest];
        if (!pt) return;

        const canvas = document.getElementById(`chart-${id}`);
        const rect = canvas.getBoundingClientRect();
        let tipX = pt.x + 12;
        let tipY = pt.y - 40;
        if (tipX + tip.offsetWidth > rect.width) tipX = pt.x - tip.offsetWidth - 12;
        if (tipY < 0) tipY = pt.y + 12;
        tip.style.left = tipX + 'px';
        tip.style.top = tipY + 'px';
    }

    function setupCrosshair(id) {
        const canvas = document.getElementById(`chart-${id}`);
        let isDragging = false;

        function handlePointer(e) {
            const chart = chartInstances[id];
            if (!chart) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const x = clientX - rect.left;
            const points = chart.getDatasetMeta(0).data;
            if (!points.length) return;

            let nearest = 0;
            let minDist = Infinity;
            points.forEach((p, i) => {
                const dist = Math.abs(p.x - x);
                if (dist < minDist) { minDist = dist; nearest = i; }
            });

            // 記錄選中的 timestamp
            const prices = chartData[id];
            if (prices && prices[nearest]) {
                selectedTs[id] = prices[nearest][0];
            }

            repositionCrosshair(id);
        }

        canvas.addEventListener('mousedown', e => { isDragging = true; handlePointer(e); });
        canvas.addEventListener('mousemove', e => { if (isDragging) handlePointer(e); });
        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            isDragging = true;
            handlePointer(e);
        }, { passive: false });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (isDragging) handlePointer(e);
        }, { passive: false });
        canvas.addEventListener('touchend', () => { isDragging = false; });
        canvas.addEventListener('click', handlePointer);
    }

    function renderChart(id, prices, days) {
        const loadingEl = document.getElementById(`loading-${id}`);
        const canvas = document.getElementById(`chart-${id}`);
        const color = SYMBOLS[currentSymbol].color;

        if (!prices || prices.length < 2) {
            loadingEl.textContent = i18n[currentLang].loadFail;
            return;
        }

        loadingEl.style.display = 'none';
        canvas.style.display = 'block';
        chartData[id] = prices;

        const labels = prices.map(([ts]) => formatLabel(ts, days));
        const values = prices.map(([, price]) => price);
        const ctx = canvas.getContext('2d');

        if (chartInstances[id]) {
            chartInstances[id].data.labels = labels;
            chartInstances[id].data.datasets[0].data = values;
            chartInstances[id].data.datasets[0].borderColor = color;
            chartInstances[id].update('none');
            // 資料更新後，重新定位十字準線
            repositionCrosshair(id);
            return;
        }

        chartInstances[id] = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: currentSymbol,
                    data: values,
                    borderColor: color,
                    borderWidth: 2,
                    pointRadius: 0,
                    hoverRadius: 0,
                    fill: false,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { maxTicksLimit: 6, color: '#555', maxRotation: 0 }
                    },
                    y: {
                        grid: { color: gridColor() },
                        ticks: {
                            color: '#555',
                            callback: v => Number(v).toLocaleString('en-US')
                        }
                    }
                }
            },
            plugins: [crosshairPlugin]
        });

        setupCrosshair(id);
    }

    function gridColor() { return document.documentElement.getAttribute('data-theme') === 'light' ? '#eceef1' : '#1a1a1a'; }
    window.addEventListener('themechange', () => {
        Object.values(chartInstances).forEach(c => { if (c && c.options && c.options.scales && c.options.scales.y) { c.options.scales.y.grid.color = gridColor(); c.update('none'); } });
    });

    // Init
    document.getElementById('btn-btc').classList.toggle('active', currentSymbol === 'BTCUSDT');
    document.getElementById('btn-xau').classList.toggle('active', currentSymbol === 'XAUUSDT');
    tzBtn.textContent = currentTz;
    applyLang(currentLang);
    connectWebSocket();
    loadCharts();
</script>
