<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡比特幣匯率與價格曲線</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #f7931a;
            --bg-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-color);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }
        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 8px;
        }
        .currency-label {
            width: 70px;
            font-size: 18px;
            font-weight: 600;
            color: #555;
        }
        input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 20px;
            text-align: right;
            font-weight: 500;
            color: var(--text-color);
            width: 100%;
            background: transparent;
        }
        input::placeholder { color: #ccc; }
        .chart-title {
            font-size: 14px;
            color: #666;
            margin-top: 24px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .chart-container {
            position: relative;
            height: 160px;
            width: 100%;
            margin-bottom: 4px;
        }
        .loading {
            text-align: center;
            color: #999;
            font-size: 14px;
            padding: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>即時匯率換算</h2>
    <div class="input-group">
        <span class="currency-label">BTC</span>
        <input type="number" id="btc-input" placeholder="1" step="any" min="0" aria-label="比特幣數量">
    </div>
    <div class="input-group">
        <span class="currency-label">USD</span>
        <input type="text" id="usd-input" readonly placeholder="計算中..." aria-label="美元金額">
    </div>

    <div class="chart-title">比特幣最近 1 小時價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-1h" class="loading">載入中...</div>
        <canvas id="chart-1h" style="display:none;" aria-label="比特幣最近1小時價格曲線"></canvas>
    </div>

    <div class="chart-title">比特幣最近 24 小時價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-24h" class="loading">載入中...</div>
        <canvas id="chart-24h" style="display:none;" aria-label="比特幣最近24小時價格曲線"></canvas>
    </div>

    <div class="chart-title">比特幣最近 3 天價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-3d" class="loading">載入中...</div>
        <canvas id="chart-3d" style="display:none;" aria-label="比特幣最近3天價格曲線"></canvas>
    </div>

    <div class="chart-title">比特幣最近 7 天價格曲線 (USD)</div>
    <div class="chart-container">
        <div id="loading-7d" class="loading">載入中...</div>
        <canvas id="chart-7d" style="display:none;" aria-label="比特幣最近7天價格曲線"></canvas>
    </div>
</div>
<script>
    let btcToUsd = 0;
    const chartInstances = {};

    // 快取時間
    const PRICE_TTL     = 60 * 1000;          // 匯率 1 分鐘
    const CHART_1H_TTL  = 5 * 60 * 1000;      // 1小時曲線來源：5 分鐘（較常更新）
    const LONG_TTL      = 60 * 60 * 1000;     // 24h / 3d / 7d：1 小時

    const btcInput = document.getElementById('btc-input');
    const usdInput = document.getElementById('usd-input');

    function getCache(key) {
        try {
            const raw = localStorage.getItem(key);
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            return parsed;
        } catch {
            return null;
        }
    }

    function setCache(key, data) {
        try {
            localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
        } catch {}
    }

    function isFresh(cache, ttl) {
        return cache && (Date.now() - cache.ts < ttl);
    }

    async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) {
            if (response.status === 429) throw new Error('API 請求過於頻繁，請稍後再試');
            throw new Error(`API 錯誤 ${response.status}`);
        }
        return response.json();
    }

    async function initData() {
        try {
            // 1. 即時匯率
            let priceCache = getCache('btc_price_usd');
            let rateData;
            if (isFresh(priceCache, PRICE_TTL)) {
                rateData = priceCache.data;
            } else {
                rateData = await fetchJson('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
                setCache('btc_price_usd', rateData);
            }
            btcToUsd = rateData.bitcoin.usd;
            btcInput.value = 1;
            updateRates(1);

            // 2. 1小時曲線（5分鐘快取）+ 24小時曲線（1小時快取）
            await load1hAnd24h();

            // 3. 3天（1小時快取）
            await loadLongChart('3d', 3);

            // 4. 7天（1小時快取）
            await loadLongChart('7d', 7);

        } catch (error) {
            console.error(error);
            document.querySelectorAll('.loading').forEach(el => {
                if (el.style.display !== 'none') {
                    el.innerText = error.message || '數據載入失敗';
                }
            });
        }
    }

    async function load1hAnd24h() {
        const cacheKey1h = 'btc_chart_1h_source';   // 給1小時用的（5分鐘）
        const cacheKey24h = 'btc_chart_24h';         // 給24小時用的（1小時）

        let pricesFor1h = null;
        let pricesFor24h = null;

        // --- 1小時來源（較常更新）---
        let cache1h = getCache(cacheKey1h);
        if (isFresh(cache1h, CHART_1H_TTL)) {
            pricesFor1h = cache1h.data.prices;
        } else {
            try {
                const data = await fetchJson('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=1');
                setCache(cacheKey1h, data);
                // 同時也更新24小時快取
                setCache(cacheKey24h, data);
                pricesFor1h = data.prices;
                pricesFor24h = data.prices;
            } catch (err) {
                if (cache1h) pricesFor1h = cache1h.data.prices;
                else throw err;
            }
        }

        // --- 24小時（較長快取）---
        if (!pricesFor24h) {
            let cache24h = getCache(cacheKey24h);
            if (isFresh(cache24h, LONG_TTL)) {
                pricesFor24h = cache24h.data.prices;
            } else if (pricesFor1h) {
                // 如果剛剛有抓到1小時的資料，就順便用
                pricesFor24h = pricesFor1h;
                setCache(cacheKey24h, { prices: pricesFor1h });
            } else {
                // 最後才獨立抓
                try {
                    const data = await fetchJson('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=1');
                    setCache(cacheKey24h, data);
                    pricesFor24h = data.prices;
                } catch (err) {
                    if (cache24h) pricesFor24h = cache24h.data.prices;
                }
            }
        }

        // 渲染 1 小時：篩選最近60分鐘 + 把即時價格補到最後
        if (pricesFor1h) {
            const oneHourAgo = Date.now() - 60 * 60 * 1000;
            let prices1h = pricesFor1h.filter(([ts]) => ts >= oneHourAgo);
            if (prices1h.length < 2) prices1h = pricesFor1h.slice(-15);

            // 補上目前即時價格，讓曲線終點與上方數字一致
            if (btcToUsd > 0) {
                prices1h = [...prices1h, [Date.now(), btcToUsd]];
            }
            renderChart('1h', prices1h, 1);
        } else {
            document.getElementById('loading-1h').innerText = '載入失敗';
        }

        // 渲染 24 小時
        if (pricesFor24h) {
            renderChart('24h', pricesFor24h, 1);
        } else {
            document.getElementById('loading-24h').innerText = '載入失敗';
        }
    }

    async function loadLongChart(id, days) {
        const cacheKey = `btc_chart_${days}d`;
        let cache = getCache(cacheKey);

        if (isFresh(cache, LONG_TTL)) {
            renderChart(id, cache.data.prices, days);
            return;
        }

        try {
            const data = await fetchJson(`https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=${days}`);
            setCache(cacheKey, data);
            renderChart(id, data.prices, days);
        } catch (err) {
            if (cache) {
                renderChart(id, cache.data.prices, days);
            } else {
                document.getElementById(`loading-${id}`).innerText = err.message || '載入失敗';
            }
        }
    }

    function updateRates(btcValue) {
        if (!Number.isFinite(btcValue) || btcValue <= 0) {
            usdInput.value = '';
            return;
        }
        usdInput.value = (btcValue * btcToUsd).toLocaleString('en-US', {
            minimumFractionDigits: 2, maximumFractionDigits: 2
        });
    }

    btcInput.addEventListener('input', (e) => updateRates(parseFloat(e.target.value)));

    function formatLabel(timestamp, days) {
        const date = new Date(timestamp);
        if (days <= 1) {
            return date.getHours().toString().padStart(2, '0') + ':' +
                   date.getMinutes().toString().padStart(2, '0');
        }
        return (date.getMonth() + 1) + '/' + date.getDate() + ' ' +
               date.getHours().toString().padStart(2, '0') + ':00';
    }

    function renderChart(id, prices, days) {
        const loadingEl = document.getElementById(`loading-${id}`);
        const canvas = document.getElementById(`chart-${id}`);

        if (!prices || prices.length < 2) {
            loadingEl.innerText = '資料不足';
            return;
        }

        loadingEl.style.display = 'none';
        canvas.style.display = 'block';

        const labels = prices.map(([ts]) => formatLabel(ts, days));
        const values = prices.map(([, price]) => price);
        const ctx = canvas.getContext('2d');

        if (chartInstances[id]) chartInstances[id].destroy();

        chartInstances[id] = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: 'BTC/USD',
                    data: values,
                    borderColor: '#f7931a',
                    borderWidth: 2,
                    pointRadius: 0,
                    hoverRadius: 4,
                    fill: false,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { maxTicksLimit: 6, color: '#999', maxRotation: 0 }
                    },
                    y: {
                        grid: { color: '#f0f0f0' },
                        ticks: {
                            color: '#999',
                            callback: v => Number(v).toLocaleString('en-US')
                        }
                    }
                }
            }
        });
    }

    initData();
</script>
</body>
</html>
